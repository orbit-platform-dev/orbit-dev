name: Deploy Orbit to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: orbit-501314
  GCP_DEPLOYER_SA: github-deployer@orbit-501314.iam.gserviceaccount.com
  GCP_WIF_PROVIDER: projects/566106241142/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  API_URL: https://orbit-api-566106241142.asia-northeast1.run.app
  WEB_URL: https://app.tryorbit.pro
  CLERK_PK: pk_test_Y2xvc2luZy1kb2Jlcm1hbi05MC5jbGVyay5hY2NvdW50cy5kZXYk

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend imports
        working-directory: backend
        env:
          ENABLE_AI: "false"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pip install -q -r requirements.txt
          python -c "import app.main"

  deploy:
    name: Build & deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy via Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --config cloudbuild.yaml \
            --substitutions=_TAG="${GITHUB_SHA::7}",_API_URL="${{ env.API_URL }}",_WEB_URL="${{ env.WEB_URL }}",_CLERK_PK="${{ env.CLERK_PK }}"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/health" || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            echo "waiting ($code)"; sleep 6
          done
          echo "API not healthy"; exit 1
